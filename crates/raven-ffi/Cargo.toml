[package]
name = "raven-ffi"
description = "Swift-facing UniFFI bridge for the RAVEN runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "raven_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
raven-core = { path = "../raven-core" }
raven-runtime = { path = "../raven-runtime" }
uniffi = { version = "0.32.1", features = ["cli"] }
once_cell = "1.21"
